{% extends 'base.html' %}
{% load static %}

{% block title %}Reschedule Interview | Swamp Hiring{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/reschedule_interview.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="applicant-profile-container">
        <h1>Reschedule Interview</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary">Save Changes</button>
            <a href="{% url 'employer_calendar' %}" class="btn-secondary" style="display:inline-block; margin-bottom:20px;">
                Back to Calendar
            </a>
        </form>
    </div>
</div>
{% endblock %}
