{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Information</title>
    <link rel="stylesheet" href="{% static 'css/employers_profile_set_up.css' %}">
</head>
<body>

    <div class="container">
        <h2>Company Information</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label for="company_name">Company Name:</label>
                <input type="text" id="company_name" name="company_name" required>
            </div>

            <div class="form-group">
                <label for="company_email">Company Email:</label>
                <input type="email" id="company_email" name="company_email" required>
            </div>

            <div class="form-group">
                <label for="company_website">Company Website:</label>
                <input type="url" id="company_website" name="company_website">
            </div>

            <div class="form-group">
                <label for="company_address">Company Address:</label>
                <textarea id="company_address" name="company_address" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="industry">Industry:</label>
                <select id="industry" name="industry" required>
                    <option value="">Select Industry</option>
                    <option value="IT">IT</option>
                    <option value="Finance">Finance</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Education">Education</option>
                </select>
            </div>

            <div class="form-group">
                <label for="company_size">Company Size:</label>
                <input type="number" id="company_size" name="company_size" min="1" required>
            </div>

            <div class="form-group">
                <label for="company_logo">Upload Company Logo:</label>
                <input type="file" id="company_logo" name="company_logo" accept="image/*">
            </div>

            <button type="submit">Save & Continue</button>
        </form>
    </div>

</body>
</html>
